services:
  bot:
    build: .
    container_name: daggervpn_bot
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - daggervpn_net

  db:
    image: postgres:16-alpine
    container_name: daggervpn_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: daggervpn
      POSTGRES_USER: daggervpn
      POSTGRES_PASSWORD: changeme
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - daggervpn_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U daggervpn"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: daggervpn_redis
    restart: unless-stopped
    networks:
      - daggervpn_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:

networks:
  daggervpn_net:
    driver: bridge
